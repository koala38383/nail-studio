<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>네일 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --cream:#fbf3df; --paper:#fffaf0; --brown:#6b4a2b; --brown-soft:#a78560; --yellow:#fde68a; --yellow-d:#e7c957;
  --green:#e0e8c0; --green-d:#a9c77c; --pink:#f8b9c9; --pink-weak:#fde4ea; --line:#ead9b8;
  --bg:var(--cream); --text:var(--brown); --sub:#98795a; --danger:#c4513f;
  --disp:"Jua","Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom));position:relative}
svg{display:block}

/* 상단 체크 띠 + 리본 */
.band{position:relative;margin:0 -16px;line-height:0}
.band svg{width:100%;height:auto}
.band .bow{position:absolute;left:50%;top:6px;width:19%;transform:translateX(-50%);max-width:110px}
.phead{margin-bottom:14px}
.ttl{position:relative;display:block;width:max-content;margin:2px auto 0;padding:2px 12px;font-family:var(--disp);font-size:26px;color:var(--brown);text-align:center}
.ttl::before{content:"";position:absolute;inset:6px 0 0;background:#fdeb9a;border-radius:20px;z-index:-1;transform:rotate(-1.2deg)}
.ttl span{position:relative}

.card{background:var(--paper);border:3px solid var(--brown);border-radius:26px;padding:18px 16px;margin-bottom:14px;box-shadow:0 4px 0 rgba(107,74,43,.16)}
.card h2{font-family:var(--disp);font-size:19px;margin:0 0 2px;font-weight:400;color:var(--brown)}
.muted{color:var(--sub);font-size:14px;line-height:1.6;margin:6px 0 14px}

.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;border:3px solid var(--brown);border-radius:999px;font-family:var(--disp);font-size:18px;
  cursor:pointer;background:var(--yellow);color:var(--brown);padding:0 20px;box-shadow:0 3px 0 var(--yellow-d), inset 0 2px 0 rgba(255,255,255,.7);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--yellow-d), inset 0 2px 0 rgba(255,255,255,.7)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sec{background:#fff3d2;box-shadow:0 3px 0 #ecd8a6, inset 0 2px 0 rgba(255,255,255,.8)}
.btn.gray{background:#f5ecd6;box-shadow:0 3px 0 #e3d3ad}
.btn.danger{background:var(--pink-weak);color:var(--danger);box-shadow:0 3px 0 #f1c4cd}
.btn.sm{height:42px;font-size:15px;padding:0 16px}
.btn.block{width:100%;margin-top:10px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}

.chips{display:flex;gap:8px;overflow-x:auto;padding:3px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:2.5px solid var(--brown);background:var(--paper);color:var(--brown);font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--yellow)}
.chip.sm{height:32px;font-size:13px;padding:0 11px;border-width:2px}

/* nail */
.nail{position:relative;display:block;width:100%;padding:0;aspect-ratio:3/4;border:2.5px solid var(--brown);cursor:pointer;overflow:hidden;
  border-radius:50% 50% 38% 38% / 44% 44% 24% 24%;background:#fde8e8}
.nail img{position:absolute;left:50%;top:50%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;max-width:none}
.nail.filled::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,0) 42%)}
.nail.empty{background:var(--paper);border:2.5px dashed var(--brown-soft)}
.nail.empty::before{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--brown-soft);font-size:26px;font-family:var(--disp)}
.nail.plain{cursor:default}
.nail.tiny{border-width:1.6px}
.nail.tiny.empty{border-style:solid;background:#fde4e4}
.nail.tiny.empty::before{content:none}
.stage{width:min(62vw,240px);margin:8px auto 0;cursor:grab;touch-action:none;box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--brown-soft)}
.stage:active{cursor:grabbing}
.hint{text-align:center;color:var(--sub);font-size:13px;margin:16px 0 8px;line-height:1.6}

.card.hands{background:var(--green)}
.hands .handtitle{font-family:var(--disp);font-size:15px;color:var(--brown);margin:4px 2px 10px}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:start;padding-bottom:62px;margin-bottom:-26px}
.hand + .handtitle{margin-top:0}
.hands .hand:last-of-type{margin-bottom:-38px}
.slot{min-width:0}
.nailwrap{position:relative}
.fname{text-align:center;font-size:11px;color:var(--brown);margin-top:6px;font-weight:600}
.lock{position:absolute;right:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:2px solid var(--brown);background:var(--paper);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:2}
.lock svg{width:14px;height:14px;fill:none;stroke:var(--brown);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lock.on{background:var(--yellow)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
.thumb{position:relative;aspect-ratio:1/1;border:2.5px solid var(--brown);padding:0;border-radius:18px;overflow:hidden;background:#f5ecd6;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sel{outline:4px solid var(--yellow);outline-offset:-4px}
.thumb .tcount{position:absolute;left:6px;bottom:6px;background:rgba(107,74,43,.78);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}

.empty-state{text-align:center;padding:26px 12px 22px}
.empty-state .mascot{width:150px;margin:0 auto 6px}

/* tab bar */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;background:var(--paper);border-top:3px solid var(--brown);
  display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20;border-radius:22px 22px 0 0}
.tab{flex:1;border:0;background:none;padding:4px 0 2px;font-family:var(--disp);font-size:12px;color:var(--brown-soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .ic{width:46px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;border:2.5px solid transparent;position:relative}
.tab .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--brown)}
.tab.on .ic{background:var(--yellow);border-color:var(--brown)}
.tab .n{position:absolute;right:-4px;top:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);border:2px solid var(--brown);color:var(--brown);font-size:10px;line-height:14px;padding:0 4px;font-family:var(--disp)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(107,74,43,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--cream);border:3px solid var(--brown);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h3{margin:0;font-family:var(--disp);font-weight:400;font-size:21px}
.x{border:2.5px solid var(--brown);background:var(--paper);border-radius:50%;width:34px;height:34px;font-size:15px;color:var(--brown);cursor:pointer}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.input{flex:1;min-width:0;height:46px;border:2.5px solid var(--brown);border-radius:16px;padding:0 14px;font-size:16px;font-family:inherit;color:var(--brown);outline:none;background:var(--paper)}
.input:focus{box-shadow:0 0 0 3px var(--yellow)}
.inrow{display:flex;gap:8px;margin:10px 0}
.taglist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{border:2px solid var(--brown);background:var(--yellow);color:var(--brown);font-size:13px;font-weight:700;border-radius:999px;height:30px;padding:0 11px;cursor:pointer}
.label{font-family:var(--disp);font-size:15px;color:var(--brown);margin:18px 0 4px}

/* saved */
.combo .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.combo .head b{font-family:var(--disp);font-weight:400;font-size:19px}
.combo .head small{color:var(--sub);font-size:12px}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.mini .nail{cursor:default;border-width:2px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--brown);color:var(--cream);
  padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:80;max-width:88%;text-align:center;animation:fade .15s}
.banner{background:#fff1cf;color:#8a5a12;border:2px solid var(--brown);border-radius:16px;padding:12px 14px;font-size:13px;margin:0 0 12px;line-height:1.5}

/* 홈 */
.home{display:flex;flex-direction:column;min-height:calc(100vh - 78px - env(safe-area-inset-bottom))}
.home .ttlwrap{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;margin:3vh 0 1vh}
.home .logo{position:relative;font-family:"Fredoka","Baloo 2","Arial Rounded MT Bold","Jua",sans-serif;font-weight:700;font-size:clamp(32px,10.6vw,56px);line-height:1.2;white-space:nowrap;
  color:#fff;-webkit-text-stroke:8px var(--brown);paint-order:stroke fill;padding:0 12px;letter-spacing:.5px}
.home .logo::before{content:"";position:absolute;inset:10% -4px 2%;background:#fdeb9a;border-radius:34px;z-index:-1;transform:rotate(-1deg)}
.home .spark{width:clamp(18px,5.6vw,30px);flex:none}
.handsbtn{position:relative;display:block;width:100%;border:0;padding:0;background:none;cursor:pointer;margin:1.5vh 0 2vh}
.handsbox{position:relative;aspect-ratio:940/520}
.handsbox > svg{position:absolute;inset:0;width:100%;height:100%}
.hn{position:absolute;pointer-events:none}
.homebtns{padding:6px 6px 0}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:clamp(62px,19vw,78px);border:4px solid var(--brown);border-radius:999px;cursor:pointer;
  background:linear-gradient(#fff0a8,#fde06a);font-family:var(--disp);font-size:clamp(22px,7vw,28px);color:var(--brown);
  box-shadow:0 5px 0 #cfae45, inset 0 3px 0 rgba(255,255,255,.7)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #cfae45, inset 0 3px 0 rgba(255,255,255,.7)}
.big svg{width:34px;height:40px}
.big .tri{width:0;height:0;border-left:13px solid var(--brown);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
.row2{display:flex;gap:10px;margin-top:14px}
.mid{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:clamp(52px,15vw,62px);border:3.5px solid var(--brown);border-radius:999px;cursor:pointer;
  background:linear-gradient(#fffbea,#fff0cf);font-family:var(--disp);font-size:clamp(14px,4.2vw,17px);color:var(--brown);padding:0 6px;
  box-shadow:0 4px 0 #e2cd9a, inset 0 2px 0 rgba(255,255,255,.8)}
.mid:active{transform:translateY(2px)}
.mid svg{width:30px;height:30px;flex:none}
.mid .cnt{position:absolute;top:-9px;right:10px;min-width:24px;height:24px;border-radius:12px;background:var(--pink);border:2.5px solid var(--brown);font-size:12px;line-height:19px;padding:0 6px}
.scene{margin:auto -16px -22px;position:relative;line-height:0}
.scene svg{width:100%;height:auto}
.mascot-bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.mascot-bob{animation:none}}

/* ===== v3: 시안(레퍼런스 보관함) + 사진첩 + 풀밭 하단 메뉴 ===== */
.app{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
.app.is-home{padding-bottom:0}
.is-home .home{min-height:100vh;min-height:100dvh}
.is-home .scene{margin-bottom:0}
.ttlrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px}
.ttlrow .ttl{margin:0;font-size:clamp(22px,6.8vw,30px)}
.pspark{width:24px;flex:none}
.chip{background:#fffaf0;border:2px solid #dcc79b}
.chip.on{background:#8fb35b;color:#fff;border-color:#5f8a36}
.chiprow{display:flex;gap:8px;align-items:flex-start;margin:6px 0 14px}
.chiprow .chips{flex:1;min-width:0;padding:3px 2px 4px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip.more{flex:none;width:40px;padding:0;font-size:18px;line-height:1;border-radius:50%}
.chip.heartchip{color:#e9758f}
.chip.heartchip.on{color:#fff}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ngrid.g4{grid-template-columns:repeat(4,1fr);gap:8px}
.thumb.ncard{aspect-ratio:2/3;border:2px solid #ead9b8;border-radius:22px;background:linear-gradient(#fffaf0,#fbf0da);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.75),0 2px 0 rgba(107,74,43,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
.ncard .nail{width:74%;border:0;box-shadow:0 3px 6px rgba(107,74,43,.22)}
.ncard img{object-fit:fill}
.thumb.ncard.sel{outline:3px solid #8fb35b;outline-offset:-3px}
.heart{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;background:none;padding:0;cursor:pointer;z-index:3}
.heart svg{width:100%;height:100%;fill:none;stroke:#7a5a3a;stroke-width:1.8;stroke-linejoin:round}
.heart.on svg{fill:#f4849e;stroke:#c14b68}
.capgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.capcard{position:relative;aspect-ratio:4/5;border:3px solid var(--brown);border-radius:22px;overflow:hidden;background:#f3e8cc;cursor:pointer;box-shadow:0 3px 0 rgba(107,74,43,.16)}
.capcard img{width:100%;height:100%;object-fit:cover;display:block}
.capcard .heart{top:7px;right:7px;width:28px;height:28px}
.capcard .heart svg{stroke:#fff;stroke-width:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.capcard .heart.on svg{fill:#f4849e;stroke:#fff}
.capview{width:100%;max-height:52vh;object-fit:contain;border-radius:18px;background:#f3e8cc;border:3px solid var(--brown);display:block;margin-bottom:6px}
.muted.foot{text-align:center;font-size:12px;margin:14px 0 0}
.fab{position:fixed;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(136px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;
  border:3.5px solid var(--brown);background:#a9c77c;color:var(--brown);font-family:var(--disp);font-size:38px;line-height:1;cursor:pointer;z-index:19;
  box-shadow:0 4px 0 #7f9c55;display:flex;align-items:center;justify-content:center;padding:0 0 4px}
.fab:active{transform:translateY(2px);box-shadow:0 2px 0 #7f9c55}
.toast{bottom:calc(136px + env(safe-area-inset-bottom))}
/* 사진에서 손톱 담기 */
.cropvp{position:relative;width:100%;max-width:420px;aspect-ratio:1/1;margin:6px auto 0;overflow:hidden;border-radius:20px;background:#3b2c1c;touch-action:none;cursor:grab}
.cropbox{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:3/4;transform:translate(-50%,-50%)}
.cropbox img{position:absolute;left:50%;top:50%;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.cropframe{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:3/4;transform:translate(-50%,-50%);border-radius:50% 50% 38% 38% / 44% 44% 24% 24%;
  box-shadow:0 0 0 999px rgba(59,44,28,.62);border:3px solid #fff;pointer-events:none}
.cropframe.flash{animation:flash .5s}
@keyframes flash{0%{border-color:#ffe27a;box-shadow:0 0 0 999px rgba(59,44,28,.62),0 0 0 8px rgba(255,226,122,.75)}100%{border-color:#fff;box-shadow:0 0 0 999px rgba(59,44,28,.62),0 0 0 0 rgba(255,226,122,0)}}
/* 하단 풀밭 메뉴 */
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;height:calc(126px + env(safe-area-inset-bottom));z-index:20;pointer-events:none}
.nav .navbg{position:absolute;left:0;right:0;bottom:0;line-height:0}
.nav .navbg svg{width:100%;height:auto}
.navmascot{position:absolute;right:14%;bottom:calc(70px + env(safe-area-inset-bottom));width:64px;line-height:0}
.navrow{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;pointer-events:auto}
.pill{flex:1;min-width:0;height:48px;border:2.5px solid var(--brown);border-radius:999px;background:linear-gradient(#fffbea,#fff0cf);font-family:var(--disp);font-size:13px;
  color:var(--brown);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 4px;box-shadow:0 3px 0 #e2cd9a;white-space:nowrap}
.pill .pi{display:flex}
.pill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill.on{background:linear-gradient(#e6f1c4,#cfe3a0);border-width:3.5px;box-shadow:0 3px 0 #a9c27a}
.pill.homepill{flex:none;width:48px;padding:0}
.pill:active{transform:translateY(2px)}
/* 홈: 3버튼 세로형 */
.row3 .mid{flex-direction:column;height:auto;padding:12px 4px 10px;gap:4px;font-size:clamp(12px,3.5vw,15px);line-height:1.2;border-radius:30px;text-align:center}
.row3 .mid svg{width:34px;height:34px}
.row3 .mid .cnt{top:-10px;right:8px}
</style>
</head>
<body>
<div class="app">
  <div id="banner"></div>
  <main id="main"></main>
</div>
<nav class="nav" id="tabbar"></nav>
<input type="file" id="fileInput" accept="image/*" multiple hidden>

<script>
/* ========= 상수 ========= */
const SUGGEST = ['파스텔','글리터','프렌치','자석','포인트','심플','겨울','여름','꾸안꾸','파츠'];
// 0~4 왼손(소지→엄지), 5~9 오른손(엄지→소지) — 손등 기준으로 보이는 순서
const FING = [
  {h:'왼손',n:'소지',off:34,rot:0},{h:'왼손',n:'약지',off:12,rot:0},{h:'왼손',n:'중지',off:0,rot:0},{h:'왼손',n:'검지',off:12,rot:0},{h:'왼손',n:'엄지',off:52,rot:10},
  {h:'오른손',n:'엄지',off:52,rot:-10},{h:'오른손',n:'검지',off:12,rot:0},{h:'오른손',n:'중지',off:0,rot:0},{h:'오른손',n:'약지',off:12,rot:0},{h:'오른손',n:'소지',off:34,rot:0}
];

/* ========= 상태 ========= */
const state = {
  tab:'home',
  refs:[],            // {id, blob, tags[], fx, fy, zoom, createdAt}
  combos:[],          // {id, name, slots[10], createdAt}
  board:Array(10).fill(null),
  locks:Array(10).fill(false),
  shuffleTag:null,
  refTag:null,
  capTag:null,
  caps:[],            // 네일샵 사진(10손 전체): {id, blob, ar, tags[], fav, createdAt}
  tagsOpen:false,
  uploadKind:'ref'
};
const urls = new Map();
const byId = id => state.refs.find(r => r.id === id);
const urlOf = id => urls.get(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

/* ========= DOM 헬퍼 ========= */
function h(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})){
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k,'');
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return e;
}

/* ========= IndexedDB (없으면 메모리로만 동작) ========= */
let db = null;
function openDB(){
  return new Promise(res => {
    try{
      const r = indexedDB.open('nailboard', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        ['refs','combos','captures'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:'id'}); });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'key'});
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
    }catch(e){ res(null); }
  });
}
function tx(store, mode, fn){
  if (!db) return Promise.resolve([]);
  return new Promise(res => {
    try{
      const t = db.transaction(store, mode);
      const s = t.objectStore(store);
      const req = fn(s);
      t.oncomplete = () => res(req && req.result !== undefined ? req.result : null);
      t.onerror = t.onabort = () => res(null);
    }catch(e){ res(null); }
  });
}
const dbAll = s => tx(s,'readonly', st => st.getAll());
const dbPut = (s,v) => tx(s,'readwrite', st => st.put(v));
const dbDel = (s,id) => tx(s,'readwrite', st => st.delete(id));

/* 크롭: 사진을 손톱 칸(3:4)을 꽉 채우는 크기로 놓고, 확대(s)와 이동(tx,ty)을 적용함. tx는 칸 너비, ty는 칸 높이 기준 */
const BA = 3/4;
function dims(r){ const ia = r.ar || BA; return {w:Math.max(1, ia/BA), h:Math.max(1, BA/ia)}; }
const MIN_S = 0.2, MAX_S = 20;   // 확대 범위: 0.2배(칸보다 작게) ~ 20배
function clampCrop(r){
  const d = dims(r);
  r.s = Math.min(MAX_S, Math.max(MIN_S, r.s || 1));
  r.rot = r.rot || 0;
  // 사진 중심이 칸 중앙에서 너무 멀어져 사진이 사라지지 않도록만 제한함
  const mx = Math.max(0.5, d.w*r.s/2), my = Math.max(0.5, d.h*r.s/2);
  r.tx = Math.min(mx, Math.max(-mx, r.tx || 0));
  r.ty = Math.min(my, Math.max(-my, r.ty || 0));
}
function applyCrop(img, r){
  clampCrop(r);
  const d = dims(r);
  img.style.width = (d.w*100) + '%';
  img.style.height = (d.h*100) + '%';
  img.style.transform = `translate(-50%,-50%) translate(${r.tx/d.w*100}%,${r.ty/d.h*100}%) rotate(${r.rot}deg) scale(${r.s})`;
}
function attachCropGestures(el, r, onEnd, sizeEl){
  const ptrs = new Map();
  let last = null, wheelTimer;
  const update = () => { const img = el.querySelector('img'); if (img) applyCrop(img, r); };
  const info = () => {
    const p = [...ptrs.values()];
    if (p.length < 2) return {mx:p[0].x, my:p[0].y, dist:0, ang:0};
    return {mx:(p[0].x+p[1].x)/2, my:(p[0].y+p[1].y)/2, dist:Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y),
      ang:Math.atan2(p[1].y-p[0].y, p[1].x-p[0].x)};
  };
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    last = info();
  });
  el.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const cur = info(), box = (sizeEl || el).getBoundingClientRect();
    r.tx += (cur.mx - last.mx) / box.width;
    r.ty += (cur.my - last.my) / box.height;
    if (ptrs.size >= 2 && last.dist > 0 && cur.dist > 0){
      r.s *= cur.dist / last.dist;
      let da = cur.ang - last.ang;
      if (da > Math.PI) da -= 2*Math.PI; else if (da < -Math.PI) da += 2*Math.PI;
      r.rot = (r.rot || 0) + da * 180 / Math.PI;
    }
    last = cur;
    update();
  });
  const end = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    last = ptrs.size ? info() : null;
    if (!ptrs.size && onEnd) onEnd();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.shiftKey) r.rot = (r.rot || 0) + (e.deltaY || e.deltaX) * 0.1;   // PC: Shift+휠 = 회전
    else r.s *= Math.exp(-e.deltaY * 0.0015);
    update();
    clearTimeout(wheelTimer); wheelTimer = setTimeout(() => onEnd && onEnd(), 300);
  }, {passive:false});
}

function valley(f1, f2){
  const cx = (f, y) => f.B[0] + (f.T[0]-f.B[0]) * (f.B[1]-y) / (f.B[1]-f.T[1]);
  for (let y = 120; y <= 560; y++){
    const d = Math.abs(cx(f2,y) - cx(f1,y)) - (f1.W + f2.W)/2;
    if (d <= 10) return [ (cx(f1,y)+cx(f2,y))/2, y ];
  }
  return [ (f1.B[0]+f2.B[0])/2, 440 ];
}
function palmPath(){
  const v = [0,1,2].map(i => valley(HF[i], HF[i+1]));
  const l = [HF[0].B[0]-HF[0].W/2, HF[0].B[1]];
  const rEdge = [HF[3].B[0]+HF[3].W/2+4, HF[3].B[1]+6];

}

function shuffle(){
  const pool = refsByTag(state.shuffleTag);
  if (!pool.length){ toast('이 태그에 해당하는 레퍼런스가 없음'); return; }
  const free = [];
  for (let i = 0; i < 10; i++) if (!(state.locks[i] && state.board[i])) free.push(i);
  if (!free.length){ toast('모든 손톱이 잠겨 있음'); return; }
  const lockedIds = new Set(state.board.filter((id,i) => id && state.locks[i]));
  let cand = pool.filter(r => !lockedIds.has(r.id));
  if (!cand.length) cand = pool;
  const shuf = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
  let queue = [];
  free.forEach(i => { if (!queue.length) queue = shuf(cand); state.board[i] = queue.pop().id; });
  persistBoard(); render();
  if (cand.length < free.length) toast('레퍼런스가 모자라서 일부는 겹침');
}

/* ========= 업로드 ========= */
async function toJpegBlob(file, max = 1000){
  let src, w, hh;
  try{ src = await createImageBitmap(file); w = src.width; hh = src.height; }
  catch(e){
    src = await new Promise((ok,no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
    w = src.naturalWidth; hh = src.naturalHeight;
  }
  const s = Math.min(1, max / Math.max(w, hh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w*s)); c.height = Math.max(1, Math.round(hh*s));
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height);
  g.drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', .86));
  return {blob, ar:c.width / c.height};
}
function openUpload(files, kind = 'ref'){
  const isCap = kind === 'cap';
  const tags = [];
  const btn = h('button',{class:'btn block', id:'confirmUpload'}, `${files.length}장 추가`);
  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = '저장하는 중...';
    let ok = 0, fail = 0;
    for (const f of files){
      try{
        const {blob, ar} = await toJpegBlob(f, isCap ? 1600 : 1000);   // 사진첩은 손톱을 잘라 쓰므로 더 크게 보관
        if (!blob) throw new Error('blob');
        const base = {id:uid(), blob, ar, tags:tags.slice(), fav:false, createdAt:Date.now()};
        if (isCap){
          await dbPut('captures', base);
          urls.set(base.id, URL.createObjectURL(blob));
          state.caps.unshift(base);
        }else{
          const r = Object.assign(base, {tx:0, ty:0, s:1, rot:0});
          await dbPut('refs', r);
          urls.set(r.id, URL.createObjectURL(blob));
          state.refs.unshift(r);
        }
        ok++;
      }catch(e){ fail++; }
    }
    closeSheet();
    toast(fail ? `${ok}장 추가, ${fail}장은 읽지 못했음` : `${ok}장 추가했음`);
  });
  openSheet(isCap ? '사진 태그 붙이기' : '태그 붙이기', h('div',{},
    h('p',{class:'muted'}, isCap
      ? `${files.length}장에 같은 태그를 한 번에 붙임. 네일샵 이름이나 분위기를 적어두면 찾기 쉬움`
      : `${files.length}장에 같은 태그를 한 번에 붙임. 건너뛰어도 되고 나중에 수정할 수 있음`),
    tagEditor(tags, () => {}),
    btn));
}

/* ========= 저장함 ========= */
function renderSaved(){
  const root = h('div');
  if (!state.combos.length){
    root.append(h('div',{class:'card empty-state'},
      h('div',{class:'mascot', html:mascotSVG()}),
      h('h2',{}, '저장한 조합이 없음'),
      h('p',{class:'muted'}, '보드에서 마음에 드는 조합을 저장하면 여기에 쌓임')));
    return root;
  }
  state.combos.forEach(c => {
    const mini = h('div',{class:'mini-wrap'});
    [0,5].forEach(s => {
      const row = h('div',{class:'mini'});
      for (let i = s; i < s+5; i++){
        const ref = c.slots[i] ? byId(c.slots[i]) : null;
        row.append(nailEl(ref,{plain:true}));
      }
      mini.append(row);
    });
    let armed = false, timer;
    const del = h('button',{class:'btn danger sm', onclick:async () => {
      if (!armed){ armed = true; del.textContent = '한 번 더 누르면 삭제됨'; timer = setTimeout(() => { armed = false; del.textContent = '삭제'; }, 3000); return; }
      clearTimeout(timer);
      state.combos = state.combos.filter(x => x.id !== c.id);
      await dbDel('combos', c.id);
      render();
    }}, '삭제');
    root.append(h('div',{class:'card combo','data-id':c.id},
      h('div',{class:'head'}, h('b',{}, c.name), h('small',{}, new Date(c.createdAt).toLocaleDateString('ko-KR',{month:'long',day:'numeric'}))),
      mini,
      h('div',{class:'btnrow'},
        h('button',{class:'btn sm load', onclick:() => {
          state.board = c.slots.map(id => (id && byId(id)) ? id : null);
          state.locks = Array(10).fill(false);
          persistBoard(); setTab('board'); toast('보드에 불러왔음');
        }}, '보드로 불러오기'), del)));
  });
  return root;
}

/* ========= 렌더 ========= */
function setTab(t){ state.tab = t; render(); window.scrollTo({top:0}); }
function render(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const home = state.tab === 'home';
  document.querySelector('.app').classList.toggle('is-home', home);
  if (home) main.append(renderHome());
  else {
    main.append(pageHeader(TITLES[state.tab]));
    main.append(state.tab === 'board' ? renderBoard() : state.tab === 'caps' ? renderCaps() : state.tab === 'refs' ? renderRefs() : renderSaved());
  }
  renderNav(home);
}

/* ========= 시작 ========= */
document.getElementById('fileInput').addEventListener('change', e => {
  const files = [...e.target.files].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
  e.target.value = '';
  if (files.length) openUpload(files, state.uploadKind);
});
(async function init(){
  db = await openDB();
  if (!db) document.getElementById('banner').append(h('div',{class:'banner'}, '이 환경에서는 저장소를 쓸 수 없어 새로고침하면 사라짐. 사파리 비공개 모드라면 일반 모드로 열어야 함'));
  const [refs, combos, metas, caps] = await Promise.all([dbAll('refs'), dbAll('combos'), dbAll('meta'), dbAll('captures')]);
  state.refs = (refs || []).sort((a,b) => b.createdAt - a.createdAt);
  for (const r of state.refs){
    // 이전 버전(슬라이더 방식) 데이터 보정
    if (r.s == null){ r.s = r.zoom || 1; r.tx = 0; r.ty = 0; }
    if (!r.ar){
      try{ const bm = await createImageBitmap(r.blob); r.ar = bm.width / bm.height; }catch(e){ r.ar = BA; }
      dbPut('refs', r);
    }
    urls.set(r.id, URL.createObjectURL(r.blob));
  }
  state.caps = (caps || []).sort((a,b) => b.createdAt - a.createdAt);
  state.caps.forEach(c => urls.set(c.id, URL.createObjectURL(c.blob)));
  state.combos = (combos || []).sort((a,b) => b.createdAt - a.createdAt);
  const b = (metas || []).find(m => m.key === 'board');
  if (b){
    state.board = b.slots.map(id => (id && byId(id)) ? id : null);
    state.locks = b.locks.slice();
  }
  render();
})();
</script>
